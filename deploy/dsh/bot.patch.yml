# Overlay for `dsh --profile sdk-minimal`, applied by bothost. All values come from the environment
# that bothost sets for the child process; nothing secret is written here.

- insert:
    # Model route: any OpenAI-compatible endpoint.
    - id: llm-bot
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          bot:
            apiKeyEnv: QQBOT_LLM_API_KEY
            api: openai-completions
            baseURL: !!js process.env.QQBOT_LLM_BASE_URL
            models:
              - id: !!js process.env.QQBOT_LLM_MODEL
                contextWindow: !!js Number(process.env.QQBOT_LLM_CONTEXT ?? 262144)

    # Tools that live in the host process: sending to the group, searching the chat record.
    - id: mcp-qq
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: qq
        transport: streamable-http
        url: !!js process.env.QQBOT_MCP_URL
        headers:
          Authorization: !!js '`Bearer ${process.env.QQBOT_MCP_TOKEN}`'
        failOnStartupError: true
        toolCallTimeoutMs: 120000   # a web look-up runs its own short conversation in the host

# Compaction (the bot writes its own note, compaction-persona.mjs) is added by bothost in a patch it writes at start,
# because a plugin given by file needs an absolute path here.

# The shell may write only inside the workspace. This limits writes, not reads or network:
# real isolation comes from where the whole process runs (a container, or its own WSL distribution).
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
